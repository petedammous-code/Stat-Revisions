name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests (structure, KaTeX, Monte-Carlo, composants)
        run: npm test
      - name: Build du site
        run: npm run build
